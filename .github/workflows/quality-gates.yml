name: Quality Gates & Commit Compliance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:

jobs:
  hook-engine:
    name: Hook Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm run hooks:doctor
      - name: Test staged isolation, routing, portability, cache, and budget
        run: pnpm run test:hooks
        env:
          MARKETPAY_HOOK_ENFORCE_BUDGET: "1"

  commitlint:
    name: Commit Lint Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Validate HEAD commit
        if: github.event_name == 'push'
        run: npx commitlint --from HEAD~1 --to HEAD --verbose

  format-and-lint:
    name: Prettier, Type & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Check Code Formatting (Prettier)
        run: pnpm run format:check
      - name: Check Frontend Types
        run: pnpm run type-check
      - name: Check Linter
        run: pnpm run lint
