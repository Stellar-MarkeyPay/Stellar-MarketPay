name: Quality Gates & Commit Compliance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Required checks must also report inside the merge queue, or a queued
  # entry never satisfies branch protection and the queue stalls.
  merge_group:

jobs:
  hook-engine:
    name: Hook Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run hooks:doctor
      - name: Test staged isolation, routing, portability, cache, and budget
        run: npm run test:hooks
        env:
          MARKETPAY_HOOK_ENFORCE_BUDGET: "1"

  commitlint:
    name: Commit Lint Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Validate HEAD commit
        if: github.event_name == 'push'
        run: npx commitlint --from HEAD~1 --to HEAD --verbose

  format-and-lint:
    name: Prettier, Type & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install Root Dependencies
        run: npm ci
      - name: Install Frontend Dependencies
        run: cd frontend && npm ci
      - name: Install Backend Dependencies
        run: cd backend && npm ci
      - name: Check Code Formatting (Prettier)
        run: npm run format:check
      - name: Check Types
        run: npm run type-check
      - name: Check Linter
        run: npm run lint
