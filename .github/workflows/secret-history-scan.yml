# Full-history secret scan.
#
# The no-secrets rule stops a credential entering history from now on. It says
# nothing about what is already there, and a credential committed two years
# ago is exactly as valid today as it was then. This job scans the whole
# history on a schedule and on demand.
#
# It is scheduled rather than required: it runs over every commit, so it does
# not belong on the critical path of a pull request, and its findings need a
# rotation rather than a code change. See docs/SECRET_RESPONSE.md.

name: Secret History Scan

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC
  workflow_dispatch:
    inputs:
      depth:
        description: "How many commits to scan (0 = all)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  scan:
    name: Scan history for credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Scan
        run: |
          node policy/cli.js scan-history \
            --depth "${{ github.event.inputs.depth || '0' }}" \
            --json-out "$RUNNER_TEMP/history.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-history-findings
          path: ${{ runner.temp }}/history.json
          retention-days: 90
          if-no-files-found: ignore
