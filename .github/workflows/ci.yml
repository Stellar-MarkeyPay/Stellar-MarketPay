name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm turbo run test:frontend build --continue --filter=frontend...
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_USE_CONTRACT_MOCK: "true"
          NEXT_PUBLIC_CONTRACT_ID: "CMOCKCONTRACTID"
          SKIP_API_CALLS: "true"
      - run: pnpm --filter frontend run build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: frontend/storybook-static/
          retention-days: 7
      - run: npx playwright install --with-deps chromium
      - run: pnpm --filter frontend run test:e2e
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_USE_CONTRACT_MOCK: "true"
          NEXT_PUBLIC_CONTRACT_ID: CMOCKCONTRACTID
      - run: pnpm --filter frontend run test:visual
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_USE_CONTRACT_MOCK: "true"
          NEXT_PUBLIC_CONTRACT_ID: CMOCKCONTRACTID
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: marketpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Check GraphQL schema registry snapshot
        run: pnpm --filter backend run graphql:schema:check
      - name: Reject breaking GraphQL schema changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GRAPHQL_SCHEMA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: pnpm --filter backend run graphql:schema:breaking -- --base "$GRAPHQL_SCHEMA_BASE_SHA"
      - run: pnpm turbo run test:backend build --continue --filter=backend...
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/marketpay_test
          JWT_SECRET: ci-test-jwt-secret-with-sufficient-length
          REDIS_URL: redis://localhost:6379
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: backend/docs/openapi.json
          retention-days: 30

  contracts:
    name: Soroban Contract (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/marketpay-contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo check --target wasm32-unknown-unknown
      - run: cargo test --features std
      - run: cargo clippy --all-targets --features std -- -D warnings
      - run: cargo install cargo-audit --locked
      - run: cargo audit --ignore RUSTSEC-2020-0071
      - run: cargo build --target wasm32-unknown-unknown --release
