version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_STELLAR_NETWORK=testnet
      - NEXT_PUBLIC_HORIZON_URL=https://horizon-testnet.stellar.org
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - STELLAR_NETWORK=testnet
      - HORIZON_URL=https://horizon-testnet.stellar.org
      - ALLOWED_ORIGINS=http://localhost:3000
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=stellar_marketpay_dev_jwt_secret_change_me
      - DATABASE_URL=postgresql://stellarwork:stellarwork_dev@postgres:5432/stellarwork
      - WAREHOUSE_DB_HOST=warehouse-postgres
      - WAREHOUSE_DB_PORT=5432
      - WAREHOUSE_DB_NAME=marketplace_warehouse
      - WAREHOUSE_DB_USER=warehouse
      - WAREHOUSE_DB_PASSWORD=warehouse_dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - redis
      - warehouse-postgres
    command: npm run dev

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: stellarwork
      POSTGRES_PASSWORD: stellarwork_dev
      POSTGRES_DB: stellarwork
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellarwork -d stellarwork"]
      interval: 5s
      timeout: 5s
      retries: 10

  warehouse-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse_dev
      POSTGRES_DB: marketplace_warehouse
    volumes:
      - warehouse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d marketplace_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  warehouse_postgres_data:
