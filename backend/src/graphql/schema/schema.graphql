type Application implements Node @cacheControl(maxAge: 0, scope: PRIVATE) {
  id: ID!
  jobId: ID!
  freelancerAddress: PublicKey!
  status: ApplicationStatus!
  coverLetter: String
  estimatedDays: Int
  createdAt: DateTime!
  updatedAt: DateTime
  """
  The bid.

  Null while a sealed-bid job is still open, for everyone including the
  client — the commitment is on-chain and the reveal has not happened yet.
  Modelled as nullable rather than as an error because "not yet revealed" is
  an ordinary state of the auction, not a failure.
  """
  bidAmount: Decimal @auth(requires: PARTICIPANT)
  "Whether this is a sealed bid awaiting reveal."
  isSealed: Boolean!
  "The on-chain commitment hash, for a sealed bid."
  commitmentHash: String @auth(requires: PARTICIPANT)
  "Answers to the job's screening questions, in the job's question order."
  screeningAnswers: [String!]! @auth(requires: PARTICIPANT)
  "The freelancer who applied."
  applicant: Profile @cost(complexity: 2)
  "The job applied to."
  job: Job @cost(complexity: 2)
  """
  The viewer's own reputation proof attached to this application, when one
  was submitted. Owner only — it is a zero-knowledge claim about the
  applicant's history.
  """
  reputationProof: JSON @auth(requires: SELF)
}

enum ApplicationStatus {
  PENDING
  ACCEPTED
  REJECTED
  WITHDRAWN
}

type ApplicationEdge {
  node: Application!
  cursor: Cursor!
}

type ApplicationConnection {
  edges: [ApplicationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

union ApplicationResult = Application | NotFoundError | ForbiddenError | UnauthorizedError

"""A point in time, serialised as an RFC 3339 / ISO 8601 string in UTC."""
scalar DateTime

"""
A Stellar ed25519 public key: 56 characters, starting with `G`.

Validated on the way in, so a malformed address is a `ValidationError` at the
edge of the graph rather than a database round trip that finds nothing.
"""
scalar PublicKey

"""
An opaque pagination cursor. Clients must treat it as a token and never parse
it: the encoding is a server implementation detail, and collections migrate
from offset to keyset paging behind it without a schema change.
"""
scalar Cursor

"""
An arbitrary-precision decimal serialised as a string.

Budgets and escrow amounts are money. IEEE-754 doubles are not, and
`Float` would silently round a 7-decimal-place stroop amount.
"""
scalar Decimal

"""
A JSON value with no fixed shape. Used only where the domain genuinely has
none — plugin payloads, screening-question answers. A `JSON` field that could
be modelled is a modelling failure deferred, not avoided.
"""
scalar JSON

"""
Who may read this field.

Enforced by wrapping the field's resolver when the schema is built, so it
holds no matter which path reaches the field. Putting the check in the
top-level query resolver instead would protect `Query.profile.email` and miss
`job.applications.edges.node.applicant.email`, which is the same field reached
from a public job.
"""
directive @auth(requires: AuthScope!) on FIELD_DEFINITION | OBJECT

"""The identity a viewer must hold to read a field."""
enum AuthScope {
  "Any caller, authenticated or not."
  PUBLIC
  "Any authenticated caller."
  AUTHENTICATED
  "The subject of the record itself — a profile's own owner."
  SELF
  "A party to the job: its client, its assigned freelancer, or an applicant."
  PARTICIPANT
  "The job's client, or the counterparty on an escrow."
  COUNTERPARTY
  "An administrator."
  ADMIN
}

"""
How long a field may be cached, and by whom.

The response's policy is the **minimum** over every field the query touched.
That is the only safe composition: one `PRIVATE` field must make the entire
response private, or a shared cache will serve one viewer's data to another.
"""
directive @cacheControl(maxAge: Int, scope: CacheScope) on FIELD_DEFINITION | OBJECT

enum CacheScope {
  "May be stored by a shared cache — a CDN, a reverse proxy."
  PUBLIC
  "May be stored only by the requesting client, if at all."
  PRIVATE
}

"""
What this field costs to resolve, for the complexity limiter.

Declared in the schema rather than in a side table so the cost is reviewed in
the same diff as the field it describes. `multipliers` names arguments whose
value scales the cost — `first` on a connection, for instance, so
`first: 1000` is priced as a thousand children rather than as one field.
"""
directive @cost(complexity: Int! = 1, multipliers: [String!]) on FIELD_DEFINITION

"""Cursor-based pagination state, per the Relay connection specification."""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: Cursor
  endCursor: Cursor
}

"""
An expected failure, modelled as data.

The top-level `errors` array still exists and still carries what it should:
bugs, timeouts, and malformed documents. Anything a client is expected to
handle appears here instead, at the position in the response where it
happened, so it cannot be silently ignored.
"""
interface Error {
  "Human-readable, safe to show a user."
  message: String!
  "Stable, machine-readable. Switch on this, never on `message`."
  code: String!
}

"The requested object does not exist, or the viewer may not know that it does."
type NotFoundError implements Error {
  message: String!
  code: String!
  "The identifier that did not resolve."
  id: ID
}

"The viewer is authenticated but not permitted."
type ForbiddenError implements Error {
  message: String!
  code: String!
  "The scope the field required."
  requiredScope: AuthScope
}

"The viewer is not authenticated and the field requires it."
type UnauthorizedError implements Error {
  message: String!
  code: String!
}

"An input value was rejected."
type ValidationError implements Error {
  message: String!
  code: String!
  "Path to the offending input field, dotted."
  field: String
}

"""
The operation could not be applied to the object in its current state — an
escrow released twice, an application accepted after bidding closed.
"""
type ConflictError implements Error {
  message: String!
  code: String!
  "The state the object was actually in."
  currentState: String
}

"""
Every error a mutation may return.

A union rather than a bare interface: a client that switches on `__typename`
gets an exhaustiveness check from the generated types, and adding a new member
is a reviewable schema change rather than a silent runtime surprise.
"""
union MutationError = NotFoundError | ForbiddenError | UnauthorizedError | ValidationError | ConflictError

"""
An object with a globally unique, opaque identifier.

`Node` exists so a client can refetch any single object it already holds —
after a mutation, or on cache eviction — without knowing which root field
produced it.
"""
interface Node {
  id: ID!
}

type Dispute implements Node @cacheControl(maxAge: 0, scope: PRIVATE) @auth(requires: PARTICIPANT) {
  id: ID!
  jobId: ID!
  status: DisputeStatus!
  reason: String!
  description: String
  "The party who raised it."
  raisedBy: PublicKey!
  raisedAt: DateTime!
  resolvedAt: DateTime
  "The arbitrator's decision, once there is one."
  resolution: DisputeResolution
  "Evidence submitted by either party."
  evidence: [Evidence!]!
  "The job under dispute."
  job: Job @cost(complexity: 2)
  """
  The assigned arbitrator.

  Null until one is assigned, and only ever the arbitrator's public profile —
  arbitration is pseudonymous by design.
  """
  arbitrator: Profile @cost(complexity: 2)
}

enum DisputeStatus {
  OPEN
  UNDER_REVIEW
  RESOLVED
  WITHDRAWN
}

enum DisputeResolution {
  RELEASE_TO_FREELANCER
  REFUND_TO_CLIENT
  SPLIT
}

"A file submitted as evidence, stored on IPFS."
type Evidence {
  "IPFS content identifier. The content itself is fetched out of band."
  cid: String!
  filename: String
  contentType: String
  sizeBytes: Int
  submittedBy: PublicKey!
  submittedAt: DateTime!
}

union DisputeResult = Dispute | NotFoundError | ForbiddenError | UnauthorizedError

type Escrow implements Node @cacheControl(maxAge: 0, scope: PRIVATE) @auth(requires: PARTICIPANT) {
  id: ID!
  "The Soroban contract identifier."
  contractId: String!
  jobId: ID!
  clientAddress: PublicKey!
  freelancerAddress: PublicKey
  amount: Decimal!
  currency: Currency!
  status: EscrowStatus!
  "Amount released so far, for partially-released escrows."
  releasedAmount: Decimal!
  "Storage schema version of the on-chain entry. v1 entries read through a shim."
  schemaVersion: Int!
  createdAt: DateTime!
  fundedAt: DateTime
  releasedAt: DateTime
  refundedAt: DateTime
  """
  When the escrow becomes eligible for a unilateral timeout refund.

  Derived from `fundedAt` plus the contract's timeout constant rather than
  stored, so it cannot drift from what the contract will actually enforce.
  """
  timeoutAt: DateTime
  "Whether the timeout has elapsed and a refund may be claimed now."
  timeoutElapsed: Boolean!
  "Per-milestone release state, for milestone escrows."
  milestones: [EscrowMilestone!]!
  "The job this escrow funds."
  job: Job @cost(complexity: 2)
  "Ledger events affecting this escrow, newest first."
  events(first: Int = 20, after: Cursor): EscrowEventConnection! @cost(complexity: 3, multipliers: ["first"])
}

enum EscrowStatus {
  PENDING
  FUNDED
  PARTIALLY_RELEASED
  RELEASED
  REFUNDED
  DISPUTED
}

type EscrowMilestone {
  index: Int!
  amount: Decimal!
  status: MilestoneStatus!
  releasedAt: DateTime
  "Transaction hash of the release, when released."
  releaseTxHash: String
}

type EscrowEvent implements Node {
  id: ID!
  type: String!
  ledger: Int
  txHash: String
  amount: Decimal
  occurredAt: DateTime!
}

type EscrowEventEdge {
  node: EscrowEvent!
  cursor: Cursor!
}

type EscrowEventConnection {
  edges: [EscrowEventEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

union EscrowResult = Escrow | NotFoundError | ForbiddenError | UnauthorizedError

type Job implements Node @cacheControl(maxAge: 30, scope: PUBLIC) {
  id: ID!
  title: String!
  description: String!
  budget: Decimal!
  currency: Currency!
  category: String!
  skills: [String!]!
  status: JobStatus!
  "The account that posted the job."
  clientAddress: PublicKey!
  "The assigned freelancer's account, once one is assigned."
  freelancerAddress: PublicKey
  deadline: DateTime
  "IANA timezone the deadline is expressed in, when the client set one."
  timezone: String
  viewCount: Int!
  applicantCount: Int!
  shareCount: Int!
  boosted: Boolean!
  boostedUntil: DateTime
  expiresAt: DateTime
  biddingClosedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime
  "Questions an applicant must answer. Public: an applicant needs them to apply."
  screeningQuestions: [String!]!
  "Milestone breakdown, when the job is milestone-based."
  milestones: [Milestone!]!
  "The client who posted this job."
  client: Profile @cost(complexity: 2)
  "The assigned freelancer, once there is one."
  freelancer: Profile @cost(complexity: 2)
  """
  Applications to this job.

  Restricted to participants. On an open marketplace the *count* is public
  (`applicantCount`) but the applications themselves are not: they contain
  bid amounts, and on a sealed-bid job disclosing them before
  `biddingClosedAt` would break the auction.
  """
  applications(first: Int = 20, after: Cursor, status: ApplicationStatus): ApplicationConnection! @auth(requires: PARTICIPANT) @cost(complexity: 3, multipliers: ["first"]) @cacheControl(maxAge: 0, scope: PRIVATE)
  """
  The escrow holding this job's funds.

  Participants only. The on-chain contract is public, but correlating it to a
  job, a client and a freelancer is exactly the linkage this field would leak.
  """
  escrow: Escrow @auth(requires: PARTICIPANT) @cost(complexity: 4) @cacheControl(maxAge: 0, scope: PRIVATE)
  "The open dispute, when the job is disputed."
  dispute: Dispute @auth(requires: PARTICIPANT) @cost(complexity: 3) @cacheControl(maxAge: 0, scope: PRIVATE)
  "Ratings left for this job, once it completed."
  ratings(first: Int = 10, after: Cursor): RatingConnection! @cost(complexity: 2, multipliers: ["first"])
  """
  Whether the viewer has already applied.

  Cheap for the client to compute from `applications`, except that a
  non-participant cannot read `applications` — which is the whole reason this
  field exists.
  """
  viewerHasApplied: Boolean! @auth(requires: AUTHENTICATED) @cacheControl(maxAge: 0, scope: PRIVATE)
  "The viewer's relationship to this job. Drives most of the screen's UI."
  viewerRole: JobViewerRole! @cacheControl(maxAge: 0, scope: PRIVATE)
  """The escrow contract's on-chain identifier."""
  escrowContractId: String @deprecated(reason: "Use `escrow.contractId`. Kept until 2027-02-01 for clients written against the REST shape; see docs/GRAPHQL.md#deprecations.")
}

"How the viewer relates to a job. `NONE` for anonymous and unrelated viewers."
enum JobViewerRole {
  NONE
  CLIENT
  FREELANCER
  APPLICANT
  ADMIN
}

enum JobStatus {
  OPEN
  IN_PROGRESS
  COMPLETED
  CANCELLED
  DISPUTED
  EXPIRED
}

enum Currency {
  XLM
  USDC
}

type Milestone {
  index: Int!
  title: String
  amount: Decimal!
  status: MilestoneStatus!
  dueDate: DateTime
  releasedAt: DateTime
}

enum MilestoneStatus {
  PENDING
  IN_PROGRESS
  SUBMITTED
  RELEASED
  DISPUTED
}

type JobEdge {
  node: Job!
  cursor: Cursor!
}

type JobConnection {
  edges: [JobEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"Filters for the job feed. Every field is optional and ANDed."
input JobFilter {
  status: JobStatus
  category: String
  skills: [String!]
  minBudget: Decimal
  maxBudget: Decimal
  currency: Currency
  clientAddress: PublicKey
  "Full-text search over title and description."
  query: String
}

enum JobSort {
  NEWEST
  OLDEST
  BUDGET_HIGH
  BUDGET_LOW
  MOST_APPLICANTS
}

union JobResult = Job | NotFoundError

"A marketplace participant. The same profile may act as client and freelancer."
type Profile implements Node @cacheControl(maxAge: 60, scope: PUBLIC) {
  id: ID!
  "The Stellar account. This is the profile's real primary key."
  address: PublicKey!
  displayName: String
  bio: String
  avatarUrl: String
  skills: [String!]!
  location: String
  languages: [String!]!
  hourlyRate: Decimal
  availability: AvailabilityStatus
  "Freelancer tier, derived from completed work and ratings."
  tier: FreelancerTier
  "When the profile first appeared."
  createdAt: DateTime!
  updatedAt: DateTime
  "Contact email. Visible only to the profile's owner and to administrators."
  email: String @auth(requires: SELF) @cacheControl(maxAge: 0, scope: PRIVATE)
  """
  Whether this profile has completed KYC.

  Not merely private but regulated: exposing it would leak a compliance
  determination about a third party.
  """
  kycStatus: KycStatus @auth(requires: SELF) @cacheControl(maxAge: 0, scope: PRIVATE)
  "Notification preferences. Owner only."
  notificationPreferences: JSON @auth(requires: SELF) @cacheControl(maxAge: 0, scope: PRIVATE)
  """
  Lifetime spend as a client.

  Owner only. A competitor could otherwise price against a client's budget
  history, and an applicant could tailor a bid to it.
  """
  totalSpent: Decimal @auth(requires: SELF) @cacheControl(maxAge: 0, scope: PRIVATE)
  "Lifetime earnings as a freelancer. Owner only, for the same reason."
  totalEarned: Decimal @auth(requires: SELF) @cacheControl(maxAge: 0, scope: PRIVATE)
  "Aggregate public statistics. Cheap; derived from counters, not scans."
  stats: ProfileStats @cost(complexity: 5)
  "Ratings this profile has received."
  ratings(first: Int = 20, after: Cursor): RatingConnection! @cost(complexity: 2, multipliers: ["first"])
  "Skill endorsements from other participants."
  endorsements(first: Int = 20, after: Cursor): SkillEndorsementConnection! @cost(complexity: 2, multipliers: ["first"])
  "Jobs this profile posted."
  jobsAsClient(first: Int = 20, after: Cursor, status: JobStatus): JobConnection! @cost(complexity: 3, multipliers: ["first"])
  "Jobs this profile was assigned."
  jobsAsFreelancer(first: Int = 20, after: Cursor, status: JobStatus): JobConnection! @cost(complexity: 3, multipliers: ["first"])
  """
  Applications this profile has submitted.

  Visible only to the profile's owner: an applicant's bid history is
  commercially sensitive, and on a sealed-bid job it is the bid itself.
  """
  applications(first: Int = 20, after: Cursor): ApplicationConnection! @auth(requires: SELF) @cost(complexity: 3, multipliers: ["first"]) @cacheControl(maxAge: 0, scope: PRIVATE)
}

type ProfileStats @cacheControl(maxAge: 300, scope: PUBLIC) {
  jobsCompleted: Int!
  jobsPosted: Int!
  averageRating: Float
  ratingCount: Int!
  "Median hours to first response on an application, when known."
  responseTimeHours: Float
}

enum AvailabilityStatus {
  AVAILABLE
  BUSY
  UNAVAILABLE
}

enum FreelancerTier {
  BRONZE
  SILVER
  GOLD
  PLATINUM
}

enum KycStatus {
  NOT_STARTED
  PENDING
  APPROVED
  REJECTED
}

type SkillEndorsement implements Node @cacheControl(maxAge: 300, scope: PUBLIC) {
  id: ID!
  skill: String!
  endorser: Profile
  createdAt: DateTime!
}

type ProfileEdge {
  node: Profile!
  cursor: Cursor!
}

type ProfileConnection {
  edges: [ProfileEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type SkillEndorsementEdge {
  node: SkillEndorsement!
  cursor: Cursor!
}

type SkillEndorsementConnection {
  edges: [SkillEndorsementEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

union ProfileResult = Profile | NotFoundError

type Rating implements Node @cacheControl(maxAge: 120, scope: PUBLIC) {
  id: ID!
  jobId: ID
  "Whom the rating is about."
  subjectAddress: PublicKey!
  "Who left it."
  authorAddress: PublicKey!
  "One to five."
  score: Int!
  comment: String
  createdAt: DateTime!
  subject: Profile @cost(complexity: 2)
  author: Profile @cost(complexity: 2)
  job: Job @cost(complexity: 2)
}

type RatingEdge {
  node: Rating!
  cursor: Cursor!
}

type RatingConnection {
  edges: [RatingEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
  "Mean score across the whole collection, not just the current page."
  averageScore: Float
}

union RatingResult = Rating | NotFoundError

type Query {
  """
  Refetch any object by its global id.

  Exists so a client can refresh a single object after a mutation without
  knowing which root field produced it.
  """
  node(id: ID!): Node @cost(complexity: 2)
  "A single job. Returns `NotFoundError` rather than null so the reason is typed."
  job(id: ID!): JobResult @cost(complexity: 2)
  "The job feed."
  jobs(first: Int = 20, after: Cursor, filter: JobFilter, sort: JobSort = NEWEST): JobConnection! @cost(complexity: 3, multipliers: ["first"])
  "A single profile, by Stellar account."
  profile(address: PublicKey!): ProfileResult @cost(complexity: 2)
  "Browse profiles."
  profiles(first: Int = 20, after: Cursor, skills: [String!], availability: AvailabilityStatus): ProfileConnection! @cost(complexity: 3, multipliers: ["first"])
  """
  The authenticated viewer.

  Null when the request is anonymous. This is the only correct way to ask
  "who am I" — a client must never infer identity from a token it decoded
  itself.
  """
  viewer: Viewer @cacheControl(maxAge: 0, scope: PRIVATE)
  "A single application. Participants only."
  application(id: ID!): ApplicationResult @auth(requires: AUTHENTICATED) @cost(complexity: 2)
  "An escrow by the job it funds. Participants only."
  escrow(jobId: ID!): EscrowResult @auth(requires: AUTHENTICATED) @cost(complexity: 3)
  "A dispute by the job it concerns. Participants only."
  dispute(jobId: ID!): DisputeResult @auth(requires: AUTHENTICATED) @cost(complexity: 3)
}

"""
The authenticated caller, and the things that belong to them.

Everything hanging off `Viewer` is implicitly the viewer's own, which is why
these fields need no further `@auth`: reaching them at all required
authentication, and they are scoped to the identity that authenticated.
"""
type Viewer @cacheControl(maxAge: 0, scope: PRIVATE) {
  address: PublicKey!
  isAdmin: Boolean!
  "The viewer's own profile."
  profile: Profile @cost(complexity: 2)
  "Jobs the viewer posted."
  postedJobs(first: Int = 20, after: Cursor, status: JobStatus): JobConnection! @cost(complexity: 3, multipliers: ["first"])
  "Jobs the viewer is working on."
  assignedJobs(first: Int = 20, after: Cursor, status: JobStatus): JobConnection! @cost(complexity: 3, multipliers: ["first"])
  "Applications the viewer has submitted."
  applications(first: Int = 20, after: Cursor, status: ApplicationStatus): ApplicationConnection! @cost(complexity: 3, multipliers: ["first"])
  "Unread notification count."
  unreadNotificationCount: Int! @cost(complexity: 2)
}

type Mutation {
  "Submit an application to a job."
  submitApplication(input: SubmitApplicationInput!): SubmitApplicationPayload! @auth(requires: AUTHENTICATED)
  "Accept an application, assigning its freelancer to the job."
  acceptApplication(input: AcceptApplicationInput!): AcceptApplicationPayload! @auth(requires: AUTHENTICATED)
  "Withdraw one of the viewer's own applications."
  withdrawApplication(input: WithdrawApplicationInput!): WithdrawApplicationPayload! @auth(requires: AUTHENTICATED)
  "Record an escrow release after the on-chain transaction has been submitted."
  releaseEscrow(input: ReleaseEscrowInput!): ReleaseEscrowPayload! @auth(requires: AUTHENTICATED)
  "Raise a dispute on a job."
  raiseDispute(input: RaiseDisputeInput!): RaiseDisputePayload! @auth(requires: AUTHENTICATED)
  "Leave a rating for a counterparty on a completed job."
  createRating(input: CreateRatingInput!): CreateRatingPayload! @auth(requires: AUTHENTICATED)
}

input SubmitApplicationInput {
  jobId: ID!
  coverLetter: String!
  bidAmount: Decimal
  estimatedDays: Int
  screeningAnswers: [String!]
  "Commitment hash, when applying to a sealed-bid job."
  commitmentHash: String
}

type SubmitApplicationPayload {
  application: Application
  job: Job
  errors: [MutationError!]!
}

input AcceptApplicationInput {
  applicationId: ID!
}

type AcceptApplicationPayload {
  application: Application
  job: Job
  errors: [MutationError!]!
}

input WithdrawApplicationInput {
  applicationId: ID!
}

type WithdrawApplicationPayload {
  application: Application
  errors: [MutationError!]!
}

input ReleaseEscrowInput {
  jobId: ID!
  "Hash of the already-submitted Soroban transaction."
  txHash: String!
  "Milestone index, for a partial release."
  milestoneIndex: Int
}

type ReleaseEscrowPayload {
  escrow: Escrow
  job: Job
  errors: [MutationError!]!
}

input RaiseDisputeInput {
  jobId: ID!
  reason: String!
  description: String
}

type RaiseDisputePayload {
  dispute: Dispute
  job: Job
  errors: [MutationError!]!
}

input CreateRatingInput {
  jobId: ID!
  subjectAddress: PublicKey!
  score: Int!
  comment: String
}

type CreateRatingPayload {
  rating: Rating
  errors: [MutationError!]!
}

type Subscription {
  """
  Changes to a single job: status transitions, assignment, applicant count.

  Open to anyone who may read the job, because all of it is public data.
  """
  jobUpdated(jobId: ID!): JobUpdateEvent!
  """
  Escrow state changes for a job — funded, released, refunded, disputed.

  Participants only, re-checked per event.
  """
  escrowUpdated(jobId: ID!): EscrowUpdateEvent! @auth(requires: PARTICIPANT)
  """New applications on a job the viewer owns."""
  applicationReceived(jobId: ID!): ApplicationEvent! @auth(requires: PARTICIPANT)
  """
  The viewer's own notifications. Takes no argument: the stream is scoped to
  the authenticated identity, so there is no id for a client to tamper with.
  """
  notificationReceived: NotificationEvent! @auth(requires: AUTHENTICATED)
}

type JobUpdateEvent {
  job: Job!
  "What changed, so a client can avoid a full re-render."
  changed: [String!]!
  occurredAt: DateTime!
}

type EscrowUpdateEvent {
  escrow: Escrow!
  previousStatus: EscrowStatus
  txHash: String
  occurredAt: DateTime!
}

type ApplicationEvent {
  application: Application!
  job: Job!
  occurredAt: DateTime!
}

type NotificationEvent {
  id: ID!
  type: String!
  title: String!
  body: String
  jobId: ID
  readAt: DateTime
  occurredAt: DateTime!
}
